[package]
name = "zandor-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Zandor — aplikasi desktop"

[lib]
name = "zandor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# `unstable` = child webview (browser Panel 4, ADR-020). Fitur `devtools` sengaja TIDAK dipakai: build rilis/beta
# tanpa Inspect Element/F12 (DevTools tetap ada di build debug). Versi di-pin persis.
tauri = { version = "=2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
keyring = "=4.2.0"
# HTTP untuk probe/ping provider (Fase 6). native-tls = schannel di Windows (trust store OS, tanpa crypto tambahan).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zandor-engine-supervisor = { path = "../../../crates/engine-supervisor" }
tauri-plugin-single-instance = "=2.5.5"
# Pemeriksa dokumen bawaan `Zandor office-check` (ADR-074): baca DOCX/XLSX/PPTX tanpa Python.
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
