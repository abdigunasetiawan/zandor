[package]
name = "zandor-gpui"
version = "0.1.0"
edition = "2024"
publish = false

# Crate terpisah dari workspace utama: GPUI berat & diambil dari git Zed.
[workspace]

[dependencies]
regex = "1"
portable-pty = "0.9"
vt100 = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pulldown-cmark = { version = "0.12", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
unicode-segmentation = "1"
ureq = { version = "3", features = ["json", "native-tls"] }
# Backend bersama dengan apps/desktop/src-tauri (modul dipakai langsung lewat #[path], bukan salinan).
zandor-engine-supervisor = { path = "../../crates/engine-supervisor" }
keyring = "=4.2.0"
wry = "0.57"
rquickjs = "0.9"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
futures = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust-embed = { version = "8", features = ["include-exclude"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Foundation", "Data_Pdf", "Storage", "Storage_Streams"] }
