[package]
name = "zandor-gpui"
version = "0.1.0"
edition = "2024"
publish = false

# Crate terpisah dari workspace utama: GPUI berat & diambil dari git Zed.
[workspace]

[dependencies]
regex = "1"
portable-pty = "0.9"
vt100 = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pulldown-cmark = { version = "0.12", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
unicode-segmentation = "1"
ureq = { version = "3", features = ["json", "native-tls"] }
native-tls = "0.2"
# Backend bersama dengan apps/desktop/src-tauri (modul dipakai langsung lewat #[path], bukan salinan).
zandor-engine-supervisor = { path = "../../crates/engine-supervisor" }
keyring = "=4.2.0"
wry = "0.57"
base64 = "0.22"
rquickjs = "0.9"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
futures = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust-embed = { version = "8", features = ["include-exclude"] }
# Dikte lokal (STT): whisper.cpp lewat whisper-rs (Unlicense/MIT). Butuh CMake + toolchain C++ saat build.
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# CDP lewat WebView2 (ADR-079). webview2-com 0.39 memakai windows 0.62, sedangkan app memakai 0.61 → alias terpisah.
webview2-com = "0.39"
windows62 = { package = "windows", version = "0.62", features = ["Win32_Foundation"] }
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Foundation", "Data_Pdf", "Storage", "Storage_Streams", "Media_Ocr", "Graphics_Imaging", "Foundation_Collections", "Globalization"] }

# Build dev: dependensi (gpui, wgpu, dst.) tetap dioptimasi agar UI tidak patah-patah saat pengembangan.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[build-dependencies]
embed-resource = "3"

# Rilis akhir (distribusi): `cargo build --profile dist --offline`. Lebih lambat dibangun, biner lebih kecil & cepat.
# Pengembangan harian tetap memakai `release` (LTO thin, 16 unit) agar iterasi cepat.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
