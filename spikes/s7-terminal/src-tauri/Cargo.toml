[package]
name = "zandor-spike-s7"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
zandor-engine-supervisor = { path = "../../s1-sidecar/supervisor" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
