<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Zandor Spike S8</title>
<style>
  /* Token zoom UI: semua ukuran memakai rem; root font-size = 16px × --ui-scale (ADR-014). */
  :root { --ui-scale: 1; --bg: #121212; --bg-2: #141414; --bg-3: #1f1f1f; --line: #262626; --fg: #e6e6e6; --muted: #8a8a8a; }
  html { font-size: calc(16px * var(--ui-scale)); }
  html, body, #root { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .topbar { height: 2.5rem; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 0.375rem; padding: 0 0.5rem; background: var(--bg-2); border-bottom: 1px solid var(--line); overflow: hidden; min-width: 0; }
  .topbar button { font-size: 0.8125rem; height: 1.75rem; flex: none; background: var(--bg-3); color: var(--fg); border: 1px solid #333; border-radius: 0.375rem; padding: 0 0.5rem; }
  .omni { flex: 1 1 auto; min-width: 4rem; font-size: 0.8125rem; height: 1.75rem; box-sizing: border-box; background: var(--bg-3); color: var(--fg); border: 1px solid #333; border-radius: 0.375rem; padding: 0 0.625rem; }
  .zoom { font-size: 0.75rem; color: var(--muted); flex: none; }
  .body { flex: 1; display: flex; min-height: 0; }
  .group { flex: 1; min-width: 0; }
  .pane { height: 100%; box-sizing: border-box; padding: 0.75rem; font-size: 0.875rem; overflow: hidden; }
  .pane.p4 { padding: 0; display: flex; flex-direction: column; }
  .pane-head { height: 2rem; flex: none; display: flex; align-items: center; padding: 0 0.75rem; color: var(--muted); font-size: 0.75rem; border-bottom: 1px solid var(--line); }
  .browser-host { flex: 1; min-height: 0; }
  .sep { width: 6px; background: var(--bg-3); }
  .sep:hover, .sep[data-separator-state="drag"] { background: #3a3a3a; }
  .rail { width: 3rem; flex: none; border-left: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; align-items: center; padding-top: 0.5rem; }
  .rail button { width: 2rem; height: 2rem; font-size: 0.875rem; background: var(--bg-3); color: var(--fg); border: 1px solid #333; border-radius: 0.375rem; }
  .overlay-menu { position: fixed; top: 2.5rem; right: 3.5rem; width: 22rem; background: var(--bg-3); border: 1px solid #333; border-radius: 0.5rem; padding: 0.5rem; z-index: 10; font-size: 0.8125rem; }
  .overlay-menu .item { padding: 0.5rem; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
